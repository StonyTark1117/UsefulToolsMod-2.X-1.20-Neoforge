	toolEffectsEnabled = true
	#If false, Overpower armor will not grant status effects when wearing a full set.
	#The armor itself still provides protection.
	armorEffectsEnabled = true

[ghost]
	#If false, ghosts will not spawn naturally in the world.
	#Ghost spawn eggs and ectoplasm will also be hidden from the creative tab.
	enabled = true
	#Fraction of natural ghost spawn attempts that actually succeed (0.0 - 1.0).
	#Higher values make ghosts more common. Default is 0.15.
	#Range: 0.0 ~ 1.0
	spawnChance = 0.15

